<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Biblioteca{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>📚 Sistema de Biblioteca</h1>

        <nav>
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('cadastrar') }}">Cadastrar Livro</a>
            <a href="{{ url_for('livros') }}">Acervo</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Sistema de Biblioteca - Flask + SQLite</p>
    </footer>

</body>
</html>
