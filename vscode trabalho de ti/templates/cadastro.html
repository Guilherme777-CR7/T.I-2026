<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - NAPI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1b6299 0%, #c1d5e6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 420px;
            padding: 30px 28px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #1b6299;
            font-size: 28px;
            margin: 0;
        }
        .header p {
            color: #888;
            font-size: 14px;
            margin: 5px 0 0 0;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group label i {
            color: #1b6299;
            margin-right: 6px;
        }
        .required {
            color: #dc3545;
        }
        .input-wrapper {
            position: relative;
        }
        .form-control {
            width: 100%;
            padding: 12px 40px 12px 14px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            background-color: #f4f7fb;
            font-size: 14px;
            color: #333;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }
        .input-icon-right {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aab5;
        }
        select.form-control {
            appearance: none;
            padding-right: 40px;
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 5px;
        }
        .btn-submit:hover {
            background: #0b5ed7;
        }
        .btn-submit i {
            margin-right: 8px;
        }
        .footer-links {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }
        .footer-links a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .footer-links .sep {
            color: #ccc;
            margin: 0 8px;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>📝 Cadastro</h1>
            <p>Crie sua conta gratuitamente</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('cadastro') }}">
            <div class="form-group">
                <label><i class="fa-regular fa-user"></i> Nome Completo <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="text" name="nome" class="form-control" placeholder="Digite seu nome completo" required>
                    <i class="fa-regular fa-id-card input-icon-right"></i>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fa-regular fa-id-badge"></i> Usuário <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="text" name="usuario" class="form-control" placeholder="Escolha um nome de usuário" required>
                    <i class="fa-solid fa-user-pen input-icon-right"></i>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-unlock-keyhole"></i> Senha <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="password" name="senha" class="form-control" placeholder="Crie uma senha segura" required>
                    <i class="fa-solid fa-lock input-icon-right"></i>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fa-regular fa-building"></i> Casa <span class="required">*</span></label>
                <div class="input-wrapper">
                    <select name="casa" class="form-control" required>
                        <option value="" disabled selected>Selecione sua casa...</option>
                        <option value="Unidade Centro">🏢 Unidade Centro</option>
                        <option value="Unidade Sul">🏢 Unidade Sul</option>
                    </select>
                    <i class="fa-solid fa-chevron-down input-icon-right"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-user-plus"></i> CADASTRAR
            </button>
        </form>

        <div class="footer-links">
            <a href="{{ url_for('login') }}">Já tenho conta</a>
            <span class="sep">|</span>
            <a href="{{ url_for('inicio') }}">Início</a>
        </div>
    </div>
</body>
</html>
